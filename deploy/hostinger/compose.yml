name: geo-master

services:
  app:
    image: geo-master:${GEO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - runtime.env
    environment:
      GEO_AUTH_MODE: proxy
      GEO_HTTP_AUTH: ${GEO_HTTP_AUTH:-}
      GEO_GUEST_USERS: ${GEO_GUEST_USERS:-guest}
      GEO_ADMIN_USERS: ${GEO_ADMIN_USERS:-geo-admin}
      # .env 관리자 계정(로그인 아이디·비밀번호)과 회원가입 방식(approval/auto/closed)
      GEO_ADMIN_ID: ${GEO_ADMIN_ID:-}
      GEO_ADMIN_PASSWORD: ${GEO_ADMIN_PASSWORD:-}
      GEO_SIGNUP_MODE: ${GEO_SIGNUP_MODE:-approval}
      GEO_AUTH_PROXY_SECRET: ${GEO_AUTH_PROXY_SECRET:?Set a random proxy authentication secret}
    volumes:
      - geo-data:/app/data
    expose:
      - "3000"
    mem_limit: 1g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: geo-master_default
      traefik.http.routers.geo-master.rule: Host(`${GEO_DOMAIN:-geo.soverin.cloud}`)
      traefik.http.routers.geo-master.entrypoints: websecure
      traefik.http.routers.geo-master.tls: "true"
      traefik.http.routers.geo-master.tls.certresolver: letsencrypt
      traefik.http.routers.geo-master.middlewares: geo-master-headers
      traefik.http.routers.geo-master.service: geo-master
      traefik.http.routers.geo-master.priority: "10"

      # Anonymous root requests get only the data-free service introduction (/welcome, no scripts).
      # Authenticated sessions and ?login=1 reach the app login gate.
      traefik.http.routers.geo-master-preview.rule: Host(`${GEO_DOMAIN:-geo.soverin.cloud}`) && (Method(`GET`) || Method(`HEAD`)) && (Path(`/link-preview.html`) || (Path(`/`) && !HeaderRegexp(`Authorization`, `.+`) && !HeaderRegexp(`Cookie`, `(^|;[ ]*)__Host-geo_session=`) && !Query(`login`, `1`)))
      traefik.http.routers.geo-master-preview.entrypoints: websecure
      traefik.http.routers.geo-master-preview.tls: "true"
      traefik.http.routers.geo-master-preview.tls.certresolver: letsencrypt
      traefik.http.routers.geo-master-preview.priority: "100"
      traefik.http.routers.geo-master-preview.service: geo-master
      traefik.http.routers.geo-master-preview.middlewares: geo-master-public-headers,geo-master-preview-path
      traefik.http.middlewares.geo-master-preview-path.replacepath.path: /welcome

      # Only these two JPEGs are public; no blanket /public or /api exception.
      traefik.http.routers.geo-master-social-images.rule: Host(`${GEO_DOMAIN:-geo.soverin.cloud}`) && (Method(`GET`) || Method(`HEAD`)) && (Path(`/og/geo-master-20261007.jpg`) || Path(`/og/geo-master-thumbnail-20261007.jpg`))
      traefik.http.routers.geo-master-social-images.entrypoints: websecure
      traefik.http.routers.geo-master-social-images.tls: "true"
      traefik.http.routers.geo-master-social-images.tls.certresolver: letsencrypt
      traefik.http.routers.geo-master-social-images.priority: "100"
      traefik.http.routers.geo-master-social-images.service: geo-master
      traefik.http.routers.geo-master-social-images.middlewares: geo-master-public-headers
      traefik.http.middlewares.geo-master-public-headers.headers.customrequestheaders.X-Geo-Auth-User: ""
      traefik.http.middlewares.geo-master-public-headers.headers.customrequestheaders.X-Geo-Auth-Secret: ""
      traefik.http.middlewares.geo-master-public-headers.headers.customrequestheaders.Authorization: ""
      traefik.http.middlewares.geo-master-public-headers.headers.contenttypenosniff: "true"
      traefik.http.middlewares.geo-master-public-headers.headers.customresponseheaders.Cache-Control: private, no-store
      traefik.http.middlewares.geo-master-public-headers.headers.customresponseheaders.Vary: Authorization
      traefik.http.middlewares.geo-master-public-headers.headers.customresponseheaders.X-Robots-Tag: noindex, nofollow
      traefik.http.middlewares.geo-master-public-headers.headers.contentsecuritypolicy: "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      traefik.http.services.geo-master.loadbalancer.server.port: "3000"
      traefik.http.middlewares.geo-master-headers.headers.customrequestheaders.X-Geo-Auth-User: ""
      traefik.http.middlewares.geo-master-headers.headers.customrequestheaders.X-Geo-Auth-Secret: ${GEO_AUTH_PROXY_SECRET:?Set a random proxy authentication secret}
      traefik.http.middlewares.geo-master-headers.headers.contenttypenosniff: "true"
      traefik.http.middlewares.geo-master-headers.headers.customresponseheaders.X-Robots-Tag: noindex, nofollow

volumes:
  geo-data:
