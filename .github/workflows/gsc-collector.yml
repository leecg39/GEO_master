name: GSC collector compatibility
on:
  pull_request:
    paths:
      - 'scripts/gsc-collect/**'
      - 'scripts/gsc-console-collect.mjs'
      - 'tests/gsc-collect.test.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/gsc-collector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22.17.0', '22.18.0', '22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The collector does not use the app's native SQLite dependency.
      - run: npm ci --ignore-scripts
      - run: npm run test:gsc
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
